name: Build and Push Docker Images

on:
  push:
    paths:
      - "*/Dockerfile"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed Dockerfiles
        id: collect
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            changed_files="$(git ls-files '*/Dockerfile')"
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            changed_files="$(git ls-files '*/Dockerfile')"
          else
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- '*/Dockerfile')"
          fi

          if [[ -z "${changed_files}" ]]; then
            echo 'matrix=[]' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          repo="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"

          changed_dirs="$(
            echo "${changed_files}" \
              | sed '/^$/d' \
              | while IFS= read -r file; do dirname "${file}"; done \
              | sort -u
          )"

          matrix="$(
            printf '%s\n' "${changed_dirs}" \
              | jq -R -s --arg owner "${owner}" --arg repo "${repo}" '
                  split("\n")
                  | map(select(length > 0))
                  | map({
                      dir: .,
                      image: ("ghcr.io/\($owner)/\($repo)-" + (gsub("/"; "-")))
                    })
                '
          )"

          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  build-and-push:
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.dir }}
          file: ${{ matrix.dir }}/Dockerfile
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:sha-${{ github.sha }}
